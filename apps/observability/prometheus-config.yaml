prometheus: 
  prometheusSpec:
    retention: 24h
    resources: 
      requests:
        memory: 256Mi
      limits:
        memory: 512Mi
    externalLabels:
      cluster: faf-homelab
grafana:
  adminUser: admin
  adminPassword: admin
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'faf-provider' 
          orgId: 1
          folder: 'faf-homelab' 
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/faf-dashboards

  dashboards:
    faf-dashboards: 
      k8s-completo:
        gnetId: 15661
        revision: 1
        datasource: Prometheus

prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false